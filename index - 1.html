<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will It Overflow?</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }

  #gear {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 10px; z-index: 10;
    background: rgba(30,30,50,.85); color: #fff; border: 1px solid #55557a; border-radius: 22px;
    padding: 10px 16px; font: 600 15px Arial, sans-serif; cursor: pointer;
  }
  #panel {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 58px); right: 10px; z-index: 10;
    width: min(300px, calc(100vw - 20px)); box-sizing: border-box;
    background: rgba(20,20,36,.95); color: #e8e8f4; border: 1px solid #55557a; border-radius: 16px;
    padding: 14px; font: 14px Arial, sans-serif; display: none; flex-direction: column; gap: 12px;
  }
  #panel.open { display: flex; }
  #panel label { display: flex; flex-direction: column; gap: 6px; }
  #panel label.row { flex-direction: row; align-items: center; gap: 8px; }
  #panel select, #panel input[type=color] {
    background: #2a2a44; color: #fff; border: 1px solid #55557a; border-radius: 8px; padding: 8px; font-size: 15px;
  }
  #panel input[type=color] { height: 42px; padding: 2px; width: 100%; box-sizing: border-box; }
  #panel input[type=range] { width: 100%; }
  #panel button {
    border: 0; border-radius: 10px; padding: 12px; font: 700 15px Arial, sans-serif; cursor: pointer;
    background: #4a4a78; color: #fff;
  }
  #panel button#recBtn { background: #d8334a; }
  #panel button#recBtn.on { background: #fff; color: #d8334a; }
  .hint { color: #8a8aa8; font-size: 12px; margin-top: -4px; }

#soundPrompt {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(5px);
}

.soundPromptBox {
  width: min(320px, 85vw);
  padding: 25px;
  border-radius: 18px;
  background: #181818;
  color: white;
  text-align: center;
  border: 1px solid #383838;
  font-family: Arial, sans-serif;
}

.soundPromptIcon {
  font-size: 34px;
  margin-bottom: 12px;
}

.soundPromptTitle {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 9px;
}

.soundPromptText {
  font-size: 13px;
  color: #aaa;
  line-height: 1.5;
  margin-bottom: 20px;
}

#enableSoundBtn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: white;
  color: black;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
}

</style>
</head>
<body>
<canvas id="c"></canvas>

<button id="gear">⚙ Options</button>

<div id="soundPrompt">
  <div class="soundPromptBox">
    <div class="soundPromptIcon">🔊</div>
    <div class="soundPromptTitle">Enjoy the sounds?</div>
    <div class="soundPromptText">
      Enable sound effects for the full experience.
    </div>
    <button id="enableSoundBtn">Enable Sound</button>
  </div>
</div>

<div id="panel">
  <label>Ball color
    <select id="colorMode">
      <option value="original">Original (orange / pink)</option>
      <option value="rainbow">Rainbow</option>
      <option value="custom">Custom color</option>
    </select>
  </label>
  <label id="colorRow" style="display:none">Choose a color
    <input type="color" id="colorPick" value="#ff6b9a">
  </label>

  <label>Speed: <b id="speedVal">1.0×</b>
    <input type="range" id="speed" min="0.25" max="3" step="0.05" value="1">
  </label>

  <label class="row"><input type="checkbox" id="recRestart" checked> Restart when recording starts</label>
  <label class="row"><input type="checkbox" id="recAuto" checked> Stop recording after overflow</label>
  <label>Recording quality
    <select id="recQuality">
      <option value="0">Screen (default)</option>
      <option value="1080">Full HD – 1080p</option>
      <option value="1440">2K – 1440p</option>
      <option value="2160">4K – 2160p</option>
    </select>
  </label>
  <div class="hint" id="recInfo"></div>
  <button id="recBtn">● Start recording</button>
  <div class="hint">The menu is not included in the recording.</div>

  <button id="restartBtn">↻ Restart</button>
  <div style="margin-top:18px; padding-top:14px; border-top:1px solid #444;">
  <label class="row">
    <input type="checkbox" id="soundToggle" checked>
    Sound effects
  </label>

  <label>Volume: <b id="soundVolumeVal">35%</b>
    <input type="range" id="soundVolume" min="0" max="100" value="35">
  </label>
</div>

</div>
<script>
// ====== SETTINGS (feel free to adjust) ======
const SPLIT_COOLDOWN = 1.0;    // seconds before a ball can be crushed again (higher = slower)
const SWING_SPEED    = 1.2;    // how fast the crusher swings
const WEDGE_HALF     = 0.30;   // halve breedte van de crusher (radialen) - higher = wider
const WEDGE_LENGTH   = 1.0;    // lengte van de crusher (1 = precies tot aan de zijkant van de arena)
const HUB_RADIUS     = 0.14;   // grootte van het massieve scharnierblok onderin (ballen kunnen daar niet in)
const OVERFLOW_ZONE  = 0.62;   // de "bovenzone": alles boven dit punt (0 = midden, 1 = bovenrand) telt voor overflow
const OVERFLOW_FILL  = 0.36;   // hoe vol die bovenzone moet zitten met ballen (0.30 = 30%)
const OVERFLOW_HOLD  = 1.0;    // seconden dat het vol moet blijven voordat de ring explodeert
// ===========================================

const TAU = Math.PI * 2;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

// Aparte verticale opnamecanvas voor TikTok
const recordCanvas = document.createElement("canvas");
recordCanvas.width = 1080;
recordCanvas.height = 1920;

const recordCtx = recordCanvas.getContext("2d");

let displayDpr = 1, W, H, dpr, R, Ri, cx, cy, S, rb, P, L, Rr, nL, nR, G, zoneY, zoneArea, wedgeLen, hubR;
const SEG = 72;
let balls, t, state, burstT, pieces;
let swingA = 0.7, wedgeTouch = false, wedgeSpeed = 0;
let spawnQueue = [], fx = [], sparks = [];
let baseLayer = null, ringLayer = null;
let hueSprites = [], customSprite = null;
let overflowTimer = 0, checkAcc = 0;

// ---------- opties (worden door het menu onderaan aangepast) ----------
let colorMode = "original", customColor = "#ff6b9a", customHSL = { h: 340, s: 100, l: 71 }, simSpeed = 1;

function resize() {
  displayDpr = Math.min(window.devicePixelRatio || 1, 1.5);
  dpr = displayDpr;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);

  R  = Math.min(W * 0.47, H * 0.38);
  Ri = R * 0.945;                // binnenkant van de ring
  cx = W / 2; cy = H * 0.53;
  S  = R / 400;                  // schaalfactor
  rb = Math.max(2.5, R * 0.02);  // radius van een bal
  G  = 650 * S;                  // zwaartekracht

  const phi = 0.22;
  P  = { x: cx, y: cy + R * 0.82 };                          // draaipunt onderaan
  L  = { x: cx - Ri * Math.cos(phi), y: cy + Ri * Math.sin(phi) };
  Rr = { x: cx + Ri * Math.cos(phi), y: cy + Ri * Math.sin(phi) };

  nL = floorNormal(P, L);
  nR = floorNormal(P, Rr);
  // crusher zwaait tot hij precies PLAT op de vloer ligt (geen ruimte meer ertussen)
  swingA = Math.atan2(Math.abs(L.x - P.x), Math.abs(L.y - P.y)) - WEDGE_HALF + 0.003;
  wedgeLen = WEDGE_LENGTH * Math.hypot(L.x - P.x, L.y - P.y);   // tot precies aan de ring
  hubR = R * HUB_RADIUS;

  // bovenzone voor de overflow-controle
  const d = OVERFLOW_ZONE * R;
  zoneY = cy - d;
  zoneArea = Ri * Ri * Math.acos(d / Ri) - d * Math.sqrt(Ri * Ri - d * d);

  hueSprites = []; customSprite = null;
  buildLayers();
  reset();
}

// Tekent alles opnieuw in een andere resolutie (zonder de animatie te herstarten)
function setRenderScale(d) {
  dpr = d;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  hueSprites = []; customSprite = null;
  buildLayers();
}

function floorNormal(a, b) {
  let nx = -(b.y - a.y), ny = (b.x - a.x);
  const len = Math.hypot(nx, ny);
  nx /= len; ny /= len;
  if (ny > 0) { nx = -nx; ny = -ny; }  // altijd omhoog
  return { x: nx, y: ny };
}

function reset() {
  balls = [{ x: cx + (Math.random() < 0.5 ? -1 : 1) * R * 0.45, y: cy, vx: 0, vy: 0, h: 20, rh: Math.random() * 360, cd: 0, pop: 0 }];
  t = 0; state = "play"; burstT = 0; pieces = [];
  spawnQueue = []; fx = []; sparks = [];
  overflowTimer = 0; checkAcc = 0;
}

// ---------- crusher (wig) ----------
let wedgePoly = [], wedgeN = [], theta = 0, thetaDot = 0;
const WEDGE_LEN = () => wedgeLen;

function updateWedge() {
  theta    = swingA * Math.sin(SWING_SPEED * t);
  thetaDot = swingA * SWING_SPEED * Math.cos(SWING_SPEED * t);
  wedgePoly = [{ x: P.x, y: P.y }];
  const K = 8, len = WEDGE_LEN();
  for (let k = 0; k <= K; k++) {
    const a = theta - WEDGE_HALF + (2 * WEDGE_HALF * k) / K;
    wedgePoly.push({ x: P.x + len * Math.sin(a), y: P.y - len * Math.cos(a) });
  }
  const c0 = { x: 0, y: 0 };
  wedgePoly.forEach(p => { c0.x += p.x; c0.y += p.y; });
  c0.x /= wedgePoly.length; c0.y /= wedgePoly.length;
  wedgeN = wedgePoly.map((a, i) => {
    const b = wedgePoly[(i + 1) % wedgePoly.length];
    let nx = (b.y - a.y), ny = -(b.x - a.x);
    const l = Math.hypot(nx, ny) || 1;
    nx /= l; ny /= l;
    const mx = (a.x + b.x) / 2 - c0.x, my = (a.y + b.y) / 2 - c0.y;
    if (nx * mx + ny * my < 0) { nx = -nx; ny = -ny; }
    return { x: nx, y: ny };
  });
}
// ===== SATISFYLAB SOUND SYSTEM =====

let soundContext = null;
let soundMaster = null;
let soundEnabled = true;
let soundVolume = 0.35;
let lastBallSound = 0;
let lastCrusherSound = 0;

function initSound() {
    const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

    if (!AudioContextClass) return;

    if (!soundContext) {
        soundContext = new AudioContextClass();

        soundMaster = soundContext.createGain();
        soundMaster.gain.value = soundEnabled ? soundVolume : 0;
        soundMaster.connect(soundContext.destination);
    }

    if (soundContext.state !== "running") {
        soundContext.resume();
    }
}

function playBallHit(impact = 1) {
    if (!soundEnabled) return;

    initSound();
    if (!soundContext) return;

    const now = performance.now();
    if (now - lastBallSound < 45) return;
    lastBallSound = now;

    const strength = Math.min(1, Math.max(0.15, impact / 8));
    const osc = soundContext.createOscillator();
    const gain = soundContext.createGain();

    osc.type = "triangle";
    osc.frequency.setValueAtTime(500 + strength * 450, soundContext.currentTime);
    osc.frequency.exponentialRampToValueAtTime(
        180,
        soundContext.currentTime + 0.045
    );

    gain.gain.setValueAtTime(0.0001, soundContext.currentTime);
    gain.gain.linearRampToValueAtTime(
        0.12 * strength,
        soundContext.currentTime + 0.005
    );
    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        soundContext.currentTime + 0.06
    );

    osc.connect(gain);
    gain.connect(soundMaster);

    osc.start();
    osc.stop(soundContext.currentTime + 0.065);
}

function playCrusherSound() {
    if (!soundEnabled) return;

    initSound();
    if (!soundContext) return;

    const now = performance.now();
    if (now - lastCrusherSound < 100) return;
    lastCrusherSound = now;

    const t = soundContext.currentTime;

    // Lage mechanische dreun
    const osc = soundContext.createOscillator();
    const bassGain = soundContext.createGain();

    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(105, t);
    osc.frequency.exponentialRampToValueAtTime(38, t + 0.22);

    bassGain.gain.setValueAtTime(0.0001, t);
    bassGain.gain.linearRampToValueAtTime(0.35, t + 0.015);
    bassGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

    osc.connect(bassGain);
    bassGain.connect(soundMaster);

    osc.start(t);
    osc.stop(t + 0.3);

    // Korte scherpe crunch
    const bufferSize = soundContext.sampleRate * 0.16;
    const buffer = soundContext.createBuffer(
        1, bufferSize, soundContext.sampleRate
    );
    const data = buffer.getChannelData(0);

    for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }

    const noise = soundContext.createBufferSource();
    const filter = soundContext.createBiquadFilter();
    const noiseGain = soundContext.createGain();

    noise.buffer = buffer;
    filter.type = "lowpass";
    filter.frequency.value = 1800;

    noiseGain.gain.setValueAtTime(0.22, t);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(soundMaster);

    noise.start(t);
}

// Browser audio starten na eerste gebruikersinteractie
document.addEventListener("pointerdown", async () => {
    initSound();

    if (soundContext && soundContext.state !== "running") {
        try {
            await soundContext.resume();
        } catch (err) {
            console.warn("Audio kon niet worden gestart:", err);
        }
    }

    if (soundMaster) {
        soundMaster.gain.value = soundEnabled ? soundVolume : 0;
    }
});

const soundPrompt = document.getElementById("soundPrompt");
const enableSoundBtn = document.getElementById("enableSoundBtn");

enableSoundBtn.addEventListener("click", async () => {
    initSound();

    try {
        if (soundContext && soundContext.state !== "running") {
            await soundContext.resume();
        }

        if (!soundContext || soundContext.state !== "running") {
            throw new Error("Audio kon niet worden geactiveerd.");
        }

        soundEnabled = true;
        soundToggle.checked = true;

        if (soundMaster) {
            soundMaster.gain.value = soundVolume;
        }

        soundPrompt.style.display = "none";

    } catch (err) {
        alert("Sound could not be activated. Please try again.");
        console.warn(err);
    }
});

// ===== SOUND SETTINGS =====

const soundToggle = document.getElementById("soundToggle");
const soundVolumeSlider = document.getElementById("soundVolume");
const soundVolumeVal = document.getElementById("soundVolumeVal");

soundToggle.addEventListener("change", () => {
    soundEnabled = soundToggle.checked;

    if (soundMaster) {
        soundMaster.gain.value = soundEnabled ? soundVolume : 0;
    }
});

soundVolumeSlider.addEventListener("input", () => {
    soundVolume = Number(soundVolumeSlider.value) / 100;

    soundVolumeVal.textContent = soundVolumeSlider.value + "%";

    if (soundMaster) {
        soundMaster.gain.value = soundEnabled ? soundVolume : 0;
    }
});


function bounce(b, nx, ny, vwx, vwy, e) {
  const rx = b.vx - vwx;
  const ry = b.vy - vwy;
  const vn = rx * nx + ry * ny;

  if (vn < 0) {
    const impact = -vn;

    const j = -(1 + e) * vn;
    b.vx += nx * j;
    b.vy += ny * j;

    // Sound on collisions with the environment
    if (impact > 35) {
      playBallHit(impact);
    }

    return impact;
  }

  return 0;
}


function collideWedge(b) {
  const n = wedgePoly.length;
  let best = Infinity, bqx = 0, bqy = 0, inside = true;
  let maxSd = -Infinity, maxI = 0;
  for (let i = 0; i < n; i++) {
    const a = wedgePoly[i], c = wedgePoly[(i + 1) % n];
    const ex = c.x - a.x, ey = c.y - a.y;
    let tt = ((b.x - a.x) * ex + (b.y - a.y) * ey) / (ex * ex + ey * ey);
    tt = Math.max(0, Math.min(1, tt));
    const qx = a.x + ex * tt, qy = a.y + ey * tt;
    const d2 = (b.x - qx) ** 2 + (b.y - qy) ** 2;
    const sd = (b.x - a.x) * wedgeN[i].x + (b.y - a.y) * wedgeN[i].y;
    if (sd > 0) inside = false;
    if (sd > maxSd) { maxSd = sd; maxI = i; }
    if (d2 < best) { best = d2; bqx = qx; bqy = qy; }
  }
  let nx, ny, pen;
  if (inside) {
    nx = wedgeN[maxI].x; ny = wedgeN[maxI].y; pen = -maxSd + rb;
  } else {
    const d = Math.sqrt(best);
    if (d >= rb) return 0;
    if (d < 1e-6) { nx = wedgeN[maxI].x; ny = wedgeN[maxI].y; }
    else { nx = (b.x - bqx) / d; ny = (b.y - bqy) / d; }
    pen = rb - d;
  }
  b.x += nx * pen; b.y += ny * pen;
  const vwx = -thetaDot * (bqy - P.y), vwy = thetaDot * (bqx - P.x);
  wedgeTouch = true;
  wedgeSpeed = Math.hypot(vwx, vwy);
  return bounce(b, nx, ny, vwx, vwy, 0.98);
}

function collideFloor(b) {
  const nrm = b.x < P.x ? nL : nR;
  const d = (b.x - P.x) * nrm.x + (b.y - P.y) * nrm.y;
  if (d < rb) {
    b.x += nrm.x * (rb - d); b.y += nrm.y * (rb - d);
    return bounce(b, nrm.x, nrm.y, 0, 0, 0.55);
  }
  return 0;
}

function collideRing(b) {
  const dx = b.x - cx, dy = b.y - cy;
  const dist = Math.hypot(dx, dy);
  if (dist > Ri - rb) {
    const nx = dx / dist, ny = dy / dist;
    b.x = cx + nx * (Ri - rb); b.y = cy + ny * (Ri - rb);
    bounce(b, -nx, -ny, 0, 0, 0.95);
  }
}

// Massief scharnierblok: ballen komen niet in het scharnier
function collideHub(b) {
  const dx = b.x - P.x, dy = b.y - P.y;
  const minD = hubR + rb;
  const d2 = dx * dx + dy * dy;
  if (d2 >= minD * minD) return;
  let d = Math.sqrt(d2), nx, ny;
  if (d < 1e-6) { nx = 0; ny = -1; d = 0; } else { nx = dx / d; ny = dy / d; }
  b.x = P.x + nx * minD; b.y = P.y + ny * minD;
  bounce(b, nx, ny, 0, 0, 0.5);
}

// Is de crusher al in de richting van deze bal gekomen? (pas dan kan hij geplet worden)
function wedgeReached(b) {
  const dx = b.x - P.x, up = P.y - b.y;
  const r = Math.hypot(dx, up) || 1;
  const aBall = Math.atan2(dx, up);          // hoek t.o.v. recht omhoog
  const tol = (rb * 1.2) / r;
  return b.x < P.x ? (theta - WEDGE_HALF) <= aBall + tol
                    : (theta + WEDGE_HALF) >= aBall - tol;
}

// Bal wordt platgedrukt: hij verdwijnt en er verschijnen 2 ballen aan de andere kant
function crush(b) {
playCrusherSound();
  b.dead = true;
  const mx = 2 * P.x - b.x;                 // spiegel aan de andere kant van de arena
  if (fx.length < 120) {
    fx.push({ x: b.x, y: b.y, age: 0 });
    fx.push({ x: mx, y: b.y - rb * 1.5, age: 0 });
  }
  if (sparks.length < 500) {
    const hue = colorMode === "rainbow" ? b.rh : b.h;
    for (let k = 0; k < 8; k++) {
      const a = Math.random() * TAU, sp = (120 + Math.random() * 260) * S;
      sparks.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80 * S, life: 0.45, h: hue });
    }
  }
  for (let k = 0; k < 2; k++) {
    spawnQueue.push({
      x: mx + (Math.random() - 0.5) * rb * 3,
      y: b.y - rb * (1 + Math.random() * 2),
      vx: (Math.random() - 0.5) * 300 * S,
      vy: -(150 + Math.random() * 250) * S,
      h: (20 + ((b.h > 180 ? b.h - 360 : b.h) - 20) * 0.7 + Math.random() * 24 - 12 + 360) % 360,
      rh: Math.random() * 360,
      cd: SPLIT_COOLDOWN,
      pop: 0.25
    });
  }
}

// ---------- bal-bal botsingen (spatial grid) ----------
let gridHead = new Int32Array(1), gridNext = new Int32Array(1), gridW = 1, gridH = 1;


function collideBalls() {
  const n = balls.length;
  const cell = rb * 2;
  const md = rb * 2;
  const md2 = md * md;

  // Meer correctierondes wanneer er veel ballen zijn
  const passes = n > 300 ? 2 : n > 150 ? 2 : 3;

  gridW = Math.ceil(W / cell) + 3;
  gridH = Math.ceil(H / cell) + 3;

  if (gridHead.length < gridW * gridH) {
    gridHead = new Int32Array(gridW * gridH);
  }

  if (gridNext.length < n) {
    gridNext = new Int32Array(n + 500);
  }

  for (let pass = 0; pass < passes; pass++) {

    // Grid opnieuw opbouwen bij iedere pass
    gridHead.fill(-1, 0, gridW * gridH);

    for (let i = 0; i < n; i++) {
      const b = balls[i];

      const gx = Math.max(0, Math.min(
        gridW - 1, Math.floor(b.x / cell) + 1
      ));

      const gy = Math.max(0, Math.min(
        gridH - 1, Math.floor(b.y / cell) + 1
      ));

      const idx = gy * gridW + gx;

      gridNext[i] = gridHead[idx];
      gridHead[idx] = i;

      b.gx = gx;
      b.gy = gy;
    }

    for (let i = 0; i < n; i++) {
      const a = balls[i];

      for (let oy = -1; oy <= 1; oy++) {
        const gy = a.gy + oy;
        if (gy < 0 || gy >= gridH) continue;

        for (let ox = -1; ox <= 1; ox++) {
          const gx = a.gx + ox;
          if (gx < 0 || gx >= gridW) continue;

          for (
            let j = gridHead[gy * gridW + gx];
            j !== -1;
            j = gridNext[j]
          ) {
            if (j <= i) continue;

            const b = balls[j];

            const dx = b.x - a.x;
            const dy = b.y - a.y;
            const d2 = dx * dx + dy * dy;

            if (d2 >= md2) continue;

            let d = Math.sqrt(d2);
            let nx, ny;

            if (d < 1e-6) {
              const ang = Math.random() * TAU;
              nx = Math.cos(ang);
              ny = Math.sin(ang);
              d = 0;
            } else {
              nx = dx / d;
              ny = dy / d;
            }

            // Geleidelijke positiecorrectie
            const correction = 0.8;
            const pen = (md - d) * 0.5 * correction;

            a.x -= nx * pen;
            a.y -= ny * pen;
            b.x += nx * pen;
            b.y += ny * pen;

            // Bestaande botsingsfysica behouden
            const vn =
              (b.vx - a.vx) * nx +
              (b.vy - a.vy) * ny;

            if (pass === 0 && vn < -0.5) {
              playBallHit(Math.abs(vn));
            }

            if (vn < 0) {
              const jj = -(1.9) * vn * 0.5;

              a.vx -= nx * jj;
              a.vy -= ny * jj;

              b.vx += nx * jj;
              b.vy += ny * jj;
            }
          }
        }
      }
    }
  }
}


// ---------- OVERFLOW: de ring explodeert pas als de arena echt vol zit ----------
function checkOverflow(dt) {
  checkAcc += dt;
  if (checkAcc < 0.1) return;
  const span = checkAcc; checkAcc = 0;
  let cnt = 0;
  for (let i = 0; i < balls.length; i++) if (balls[i].y < zoneY) cnt++;
  const filled = (cnt * Math.PI * rb * rb) / zoneArea;
  if (filled >= OVERFLOW_FILL) overflowTimer += span;
  else overflowTimer = Math.max(0, overflowTimer - span);
  // noodrem (alleen om te voorkomen dat een traag apparaat vastloopt)
  if (overflowTimer >= OVERFLOW_HOLD || balls.length > 5000) startBurst();
}

function startBurst() {
  state = "burst"; burstT = 0;
  const Rmid = (Ri + R) / 2;
  pieces = [];
  for (let i = 0; i < SEG; i++) {
    const a = ((i + 0.5) / SEG) * TAU;
    const sp = (150 + Math.random() * 350) * S;
    pieces.push({
      a, x: cx + Math.cos(a) * Rmid, y: cy + Math.sin(a) * Rmid,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 200 * S,
      rot: a, vr: (Math.random() - 0.5) * 8
    });
  }
  for (const b of balls) {
    b.vx += ((b.x - cx) / R) * 350 * S + (Math.random() - 0.5) * 100 * S;
    b.vy += ((b.y - cy) / R) * 350 * S - Math.random() * 250 * S;
  }
}

function squeezed(b) {
  const nrm = b.x < P.x ? nL : nR;
  const d = (b.x - P.x) * nrm.x + (b.y - P.y) * nrm.y;      // afstand tot vloer
  if (d < rb * 2.4) return true;
  const dist = Math.hypot(b.x - cx, b.y - cy);               // afstand tot ring
  return dist > Ri - rb * 2.4;
}

function step(dt) {
  t += dt;
  updateWedge();
  const n = balls.length;

  for (let i = 0; i < n; i++) {
    const b = balls[i];
    b.cd -= dt;
    if (b.pop > 0) b.pop -= dt;
    b.vy += G * dt;
    b.x += b.vx * dt; b.y += b.vy * dt;

    // 1. normale botsingen met ring en vloer
    if (state === "play") collideRing(b);
    collideFloor(b);
    collideHub(b);

    // 2. crusher duwt de bal weg
    wedgeTouch = false;
    collideWedge(b);

    // 3. GEPLET? Alleen als de crusher naar de vloer toe beweegt en de bal ertussen zit
    const closing = b.x < P.x ? thetaDot < -0.05 : thetaDot > 0.05;
    if (state === "play" && !b.dead && wedgeTouch && closing && b.cd <= 0 && wedgeReached(b) && squeezed(b)) crush(b);

    // 4. muren nogmaals oplossen
    if (state === "play") collideRing(b);
    collideFloor(b);
    collideHub(b);
  }

  if (spawnQueue.length || fx.length || sparks.length) {
    if (spawnQueue.length) {
      balls = balls.filter(b => !b.dead);
      for (const nb of spawnQueue) balls.push(nb);
      spawnQueue = [];
    }
    for (const f of fx) f.age += dt;
    fx = fx.filter(f => f.age < 0.35);
    for (const sp of sparks) {
      sp.life -= dt; sp.vy += G * 0.6 * dt;
      sp.x += sp.vx * dt; sp.y += sp.vy * dt;
    }
    sparks = sparks.filter(sp => sp.life > 0);
  }

  if (state === "play") {
    collideBalls();
    checkOverflow(dt);
  }

  if (state === "burst") {
    burstT += dt;
    for (const p of pieces) {
      p.vy += 800 * S * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
    }
    balls = balls.filter(b => b.y < H + 100 && b.x > -100 && b.x < W + 100);
    if (burstT > 4) { finishRun(); reset(); }
  }
}

// ---------- ballen als echte, glanzende bollen (sprites) ----------
function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  let h = 0, s = 0; const l = (mx + mn) / 2, d = mx - mn;
  if (d) {
    s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
    if (mx === r) h = (g - b) / d + (g < b ? 6 : 0);
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
  }
  return { h, s: s * 100, l: l * 100 };
}

function makeBallSprite(h, s, l) {
  const r = rb * dpr, pad = 2, SZ = Math.ceil(2 * r) + pad * 2;
  const c = document.createElement("canvas");
  c.width = SZ; c.height = SZ;
  const g = c.getContext("2d");
  const cc = SZ / 2;

  // bol met licht van linksboven
  const gr = g.createRadialGradient(cc - r * 0.35, cc - r * 0.4, r * 0.08, cc, cc, r);
  gr.addColorStop(0,    `hsl(${h},${s * 0.6}%,${Math.min(92, l + 30)}%)`);
  gr.addColorStop(0.35, `hsl(${h},${s}%,${l}%)`);
  gr.addColorStop(0.85, `hsl(${h},${s}%,${Math.max(12, l - 24)}%)`);
  gr.addColorStop(1,    `hsl(${h},${s}%,${Math.max(8, l - 36)}%)`);
  g.fillStyle = gr;
  g.beginPath(); g.arc(cc, cc, r, 0, TAU); g.fill();

  // weerkaatst licht rechtsonder
  g.save();
  g.beginPath(); g.arc(cc, cc, r, 0, TAU); g.clip();
  const g2 = g.createRadialGradient(cc + r * 0.3, cc + r * 0.6, 0, cc + r * 0.3, cc + r * 0.6, r * 0.7);
  g2.addColorStop(0, "rgba(255,255,255,0.22)"); g2.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = g2; g.fillRect(0, 0, SZ, SZ);
  g.restore();

  // glanzende highlight
  const g3 = g.createRadialGradient(cc - r * 0.4, cc - r * 0.45, 0, cc - r * 0.4, cc - r * 0.45, r * 0.38);
  g3.addColorStop(0, "rgba(255,255,255,0.95)"); g3.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = g3;
  g.beginPath(); g.arc(cc - r * 0.4, cc - r * 0.45, r * 0.38, 0, TAU); g.fill();

  return { c, size: SZ / dpr };
}

function drawBalls() {
  for (let i = 0; i < balls.length; i++) {
    const b = balls[i];
    let sp;
    if (colorMode === "custom") {
      sp = customSprite || (customSprite = makeBallSprite(customHSL.h, customHSL.s, Math.max(35, Math.min(70, customHSL.l))));
    } else {
      const hi = Math.round((colorMode === "rainbow" ? b.rh : b.h) / 4) % 90;
      sp = hueSprites[hi] || (hueSprites[hi] = makeBallSprite(hi * 4, 75, 60));
    }
    let size = sp.size;
    if (b.pop > 0) size *= 1 - Math.pow(b.pop / 0.25, 2) * 0.7;   // "plop"-effect bij het verschijnen
    ctx.drawImage(sp.c, b.x - size / 2, b.y - size / 2, size, size);
  }
}

// ---------- ring-stukken ----------
function drawPiece(g, x, y, rot) {
  const thick = R * 0.055, len = ((TAU * ((Ri + R) / 2)) / SEG) * 0.92;
  g.save();
  g.translate(x, y);
  g.rotate(rot);
  const gr = g.createLinearGradient(-thick / 2, 0, thick / 2, 0);
  gr.addColorStop(0, "#6a6a94"); gr.addColorStop(0.5, "#4a4a70"); gr.addColorStop(1, "#2f2f4a");
  g.fillStyle = gr;
  g.fillRect(-thick / 2, -len / 2, thick, len);
  g.fillStyle = "rgba(255,255,255,0.16)";                      // lichte binnenrand
  g.fillRect(-thick / 2, -len / 2, thick * 0.14, len);
  g.fillStyle = "rgba(0,0,0,0.3)";                             // donkere buitenrand
  g.fillRect(thick / 2 - thick * 0.1, -len / 2, thick * 0.1, len);
  g.fillStyle = "#1f1f33";                                     // bout
  g.beginPath(); g.arc(0, 0, thick * 0.14, 0, TAU); g.fill();
  g.fillStyle = "rgba(255,255,255,0.35)";
  g.beginPath(); g.arc(-thick * 0.04, -thick * 0.04, thick * 0.05, 0, TAU); g.fill();
  g.restore();
}

// ---------- vaste lagen (1x getekend, daarna alleen gekopieerd) ----------
function makeLayer() {
  const c = document.createElement("canvas");
  c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { c, g };
}

function bolt(g, x, y, r) {
  g.fillStyle = "#2c2c48";
  g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  g.fillStyle = "rgba(255,255,255,0.4)";
  g.beginPath(); g.arc(x - r * 0.3, y - r * 0.3, r * 0.4, 0, TAU); g.fill();
}

function buildLayers() {
  const base = makeLayer(), ring = makeLayer();
  const g = base.g;

  g.fillStyle = "#0b0b14"; g.fillRect(0, 0, W, H);

  // titel
  g.textAlign = "center";
  g.fillStyle = "#fff";
  g.font = `bold ${R * 0.1}px "Arial Narrow", Arial, sans-serif`;
  g.fillText("Will It Overflow?", cx, cy - R - R * 0.17);
  g.fillStyle = "#8a8aa8";
  g.font = `${R * 0.045}px Arial, sans-serif`;
  g.fillText("every hit splits a ball", cx, cy - R - R * 0.09);

  // arena-achtergrond met diepte
  const bg = g.createRadialGradient(cx, cy - R * 0.25, R * 0.1, cx, cy, Ri);
  bg.addColorStop(0, "#17172e"); bg.addColorStop(1, "#090913");
  g.fillStyle = bg;
  g.beginPath(); g.arc(cx, cy, Ri, 0, TAU); g.fill();
  g.strokeStyle = "rgba(130,130,200,0.07)"; g.lineWidth = 1;
  for (const f of [0.33, 0.66]) { g.beginPath(); g.arc(cx, cy, Ri * f, 0, TAU); g.stroke(); }
  const sh = g.createRadialGradient(cx, cy, Ri * 0.82, cx, cy, Ri);
  sh.addColorStop(0, "rgba(0,0,0,0)"); sh.addColorStop(1, "rgba(0,0,0,0.55)");
  g.fillStyle = sh;
  g.beginPath(); g.arc(cx, cy, Ri, 0, TAU); g.fill();

  // ----- gebogen vloer -----
  const phi = 0.22, aL = Math.PI - phi, aR = phi;
  g.save();
  g.beginPath(); g.moveTo(P.x, P.y); g.lineTo(L.x, L.y); g.arc(cx, cy, Ri, aL, aR, true); g.closePath();
  const fg = g.createLinearGradient(0, L.y, 0, cy + Ri);
  fg.addColorStop(0, "#a2a2c6"); fg.addColorStop(0.5, "#76769c"); fg.addColorStop(1, "#4c4c70");
  g.fillStyle = fg; g.fill();
  g.clip();

  // gebogen groeven (parallel aan de ring)
  for (let k = 1; k <= 4; k++) {
    const rr = Ri - k * R * 0.045;
    g.beginPath(); g.arc(cx, cy, rr, aL, aR, true);
    g.strokeStyle = "rgba(15,15,35,0.4)"; g.lineWidth = 2; g.stroke();
    g.beginPath(); g.arc(cx, cy, rr + 2, aL, aR, true);
    g.strokeStyle = "rgba(255,255,255,0.14)"; g.lineWidth = 1; g.stroke();
  }
  // naden die vanuit het draaipunt waaieren
  const N = 12;
  for (let i = 0; i <= N; i++) {
    const a = aR + ((aL - aR) * i) / N;
    g.beginPath(); g.moveTo(P.x, P.y); g.lineTo(cx + Math.cos(a) * Ri, cy + Math.sin(a) * Ri);
    g.strokeStyle = "rgba(15,15,35,0.35)"; g.lineWidth = 2; g.stroke();
  }
  // bouten langs de boog
  for (let a = aR + 0.12; a < aL - 0.1; a += 0.13) {
    const rr = Ri - R * 0.022;
    const bx = cx + Math.cos(a) * rr, by = cy + Math.sin(a) * rr;
    if (Math.hypot(bx - P.x, by - P.y) > hubR + R * 0.04) bolt(g, bx, by, R * 0.009);
  }
  g.restore();

  // randen van de hellingen (opstaande lip) + bouten
  for (const E of [L, Rr]) {
    const dx = E.x - P.x, dy = E.y - P.y, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len;
    const nrm = E === L ? nL : nR;
    g.beginPath(); g.moveTo(P.x, P.y); g.lineTo(E.x, E.y);
    g.strokeStyle = "rgba(10,10,30,0.55)"; g.lineWidth = R * 0.014; g.stroke();
    g.beginPath(); g.moveTo(P.x, P.y); g.lineTo(E.x, E.y);
    g.strokeStyle = "#d6d6f2"; g.lineWidth = R * 0.006; g.stroke();
    for (let tt = hubR + R * 0.06; tt < len - R * 0.05; tt += R * 0.1) {
      bolt(g, P.x + ux * tt - nrm.x * R * 0.035, P.y + uy * tt - nrm.y * R * 0.035, R * 0.008);
    }
    // dwarse naden over de helling
    for (let tt = R * 0.3; tt < len - R * 0.05; tt += R * 0.18) {
      g.beginPath();
      g.moveTo(P.x + ux * tt - nrm.x * R * 0.008, P.y + uy * tt - nrm.y * R * 0.008);
      g.lineTo(P.x + ux * tt - nrm.x * R * 0.06, P.y + uy * tt - nrm.y * R * 0.06);
      g.strokeStyle = "rgba(15,15,35,0.4)"; g.lineWidth = 1.5; g.stroke();
    }
  }

  // plaat onder de naaf
  const hp = g.createRadialGradient(P.x - R * 0.03, P.y - R * 0.03, R * 0.01, P.x, P.y, hubR * 1.05);
  hp.addColorStop(0, "#6a6a92"); hp.addColorStop(1, "#2e2e4a");
  g.fillStyle = hp;
  g.beginPath(); g.arc(P.x, P.y, hubR, 0, TAU); g.fill();
  g.strokeStyle = "rgba(255,255,255,0.3)"; g.lineWidth = 1.5; g.stroke();
  g.strokeStyle = "rgba(0,0,0,0.35)"; g.lineWidth = R * 0.006;
  g.beginPath(); g.arc(P.x, P.y, hubR - R * 0.008, 0, TAU); g.stroke();

  // ----- ring (aparte laag zodat hij kan exploderen) -----
  const rg = ring.g, Rmid = (Ri + R) / 2;
  for (let i = 0; i < SEG; i++) {
    const a = ((i + 0.5) / SEG) * TAU;
    drawPiece(rg, cx + Math.cos(a) * Rmid, cy + Math.sin(a) * Rmid, a);
  }
  rg.strokeStyle = "rgba(150,150,230,0.22)"; rg.lineWidth = 1.5;
  rg.beginPath(); rg.arc(cx, cy, Ri, 0, TAU); rg.stroke();
  rg.strokeStyle = "rgba(0,0,0,0.5)";
  rg.beginPath(); rg.arc(cx, cy, R + 0.5, 0, TAU); rg.stroke();

  baseLayer = base; ringLayer = ring;
}

// ---------- de crusher ----------
function drawWedge() {
  const len = WEDGE_LEN(), hw = WEDGE_HALF;
  const A0 = -Math.PI / 2 - hw, A1 = -Math.PI / 2 + hw;
  const path = (r, a0, a1) => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, r, a0, a1); ctx.closePath(); };

  ctx.save();
  ctx.translate(P.x, P.y);
  ctx.rotate(theta);

  // lichaam met schaduw en metaalglans
  ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = R * 0.03; ctx.shadowOffsetY = R * 0.012;
  const sx = len * Math.sin(hw);
  const body = ctx.createLinearGradient(-sx, 0, sx, 0);
  body.addColorStop(0, "#8c8fb8"); body.addColorStop(0.5, "#c9cbe9"); body.addColorStop(1, "#8c8fb8");
  ctx.fillStyle = body; path(len, A0, A1); ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;

  // donkerder bij het draaipunt
  const dark = ctx.createRadialGradient(0, 0, 0, 0, 0, len * 0.6);
  dark.addColorStop(0, "rgba(10,10,40,0.55)"); dark.addColorStop(1, "rgba(10,10,40,0)");
  ctx.fillStyle = dark; path(len, A0, A1); ctx.fill();

  // details binnen de vorm
  ctx.save();
  path(len, A0, A1); ctx.clip();

  // paneellijnen
  for (const f of [0.26, 0.42, 0.58, 0.74]) {
    ctx.beginPath(); ctx.arc(0, 0, len * f, A0, A1);
    ctx.strokeStyle = "rgba(35,35,75,0.5)"; ctx.lineWidth = R * 0.006; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, len * f + R * 0.006, A0, A1);
    ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = R * 0.003; ctx.stroke();
  }

  // waarschuwingsband (geel/zwart) aan de punt
  const NS = 9, r1 = len * 0.87, r2 = len * 1.01, stp = (2 * hw) / NS;
  ctx.fillStyle = "#1b1b2d";
  ctx.beginPath(); ctx.arc(0, 0, r2, A0, A1); ctx.arc(0, 0, r1, A1, A0, true); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#f0c43c";
  for (let k = 0; k < NS; k += 2) {
    const a = A0 + k * stp, sh = stp * 0.6;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
    ctx.lineTo(Math.cos(a + sh) * r2, Math.sin(a + sh) * r2);
    ctx.lineTo(Math.cos(a + sh + stp) * r2, Math.sin(a + sh + stp) * r2);
    ctx.lineTo(Math.cos(a + stp) * r1, Math.sin(a + stp) * r1);
    ctx.closePath(); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0, r1, A0, A1);
  ctx.strokeStyle = "rgba(20,20,40,0.7)"; ctx.lineWidth = R * 0.006; ctx.stroke();
  ctx.restore();

  // sleuf in het midden met schaalverdeling
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -len * 0.2); ctx.lineTo(0, -len * 0.7);
  ctx.strokeStyle = "#2a2b4a"; ctx.lineWidth = R * 0.04; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -len * 0.2); ctx.lineTo(0, -len * 0.7);
  ctx.strokeStyle = "#15162b"; ctx.lineWidth = R * 0.026; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-R * 0.008, -len * 0.22); ctx.lineTo(-R * 0.008, -len * 0.68);
  ctx.strokeStyle = "rgba(120,125,200,0.35)"; ctx.lineWidth = R * 0.004; ctx.stroke();
  ctx.lineCap = "butt";
  ctx.strokeStyle = "rgba(160,165,230,0.5)"; ctx.lineWidth = 1;
  for (let f = 0.26; f < 0.68; f += 0.06) {
    ctx.beginPath(); ctx.moveTo(-R * 0.011, -len * f); ctx.lineTo(R * 0.011, -len * f); ctx.stroke();
  }

  // nagels langs de zijkanten
  for (const side of [-1, 1]) {
    for (let f = 0.2; f < 0.86; f += 0.11) {
      const a = side * hw * 0.88;
      bolt(ctx, Math.sin(a) * len * f, -Math.cos(a) * len * f, R * 0.0085);
    }
  }

  // lampje: rood vlak voordat de crusher dichtklapt, anders groen
  const near = Math.abs(theta) > swingA * 0.88;
  ctx.shadowColor = near ? "#ff4a5e" : "#4aff9a"; ctx.shadowBlur = R * 0.035;
  ctx.fillStyle = near ? "#ff4a5e" : "#4aff9a";
  ctx.beginPath(); ctx.arc(0, -len * 0.79, R * 0.014, 0, TAU); ctx.fill();
  ctx.shadowColor = "transparent"; ctx.shadowBlur = 0;

  // rand (lichte rand + donkere binnenrand)
  path(len, A0, A1);
  ctx.strokeStyle = "rgba(255,255,255,0.55)"; ctx.lineWidth = R * 0.004; ctx.stroke();
  path(len * 0.985, A0 + 0.012, A1 - 0.012);
  ctx.strokeStyle = "rgba(30,30,70,0.55)"; ctx.lineWidth = R * 0.003; ctx.stroke();

  ctx.restore();

  // draaipunt (naaf) met draaiende bouten
  ctx.save();
  ctx.translate(P.x, P.y);
  const hg = ctx.createRadialGradient(-R * 0.02, -R * 0.02, R * 0.01, 0, 0, R * 0.1);
  hg.addColorStop(0, "#d4d6f0"); hg.addColorStop(1, "#5a5c88");
  ctx.fillStyle = hg; ctx.strokeStyle = "#2c2c4a"; ctx.lineWidth = R * 0.006;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.095, 0, TAU); ctx.fill(); ctx.stroke();
  ctx.rotate(theta * 2);
  for (let k = 0; k < 6; k++) {
    const a = (k * TAU) / 6;
    bolt(ctx, Math.cos(a) * R * 0.068, Math.sin(a) * R * 0.068, R * 0.012);
  }
  const cg = ctx.createRadialGradient(-R * 0.01, -R * 0.01, 0, 0, 0, R * 0.042);
  cg.addColorStop(0, "#f0f1ff"); cg.addColorStop(1, "#7a7ca8");
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0, 0, R * 0.04, 0, TAU); ctx.fill();
  ctx.strokeStyle = "#2c2c4a"; ctx.lineWidth = R * 0.005; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-R * 0.03, 0); ctx.lineTo(R * 0.03, 0); ctx.moveTo(0, -R * 0.03); ctx.lineTo(0, R * 0.03); ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.drawImage(baseLayer.c, 0, 0, W, H);

  if (state === "play") ctx.drawImage(ringLayer.c, 0, 0, W, H);
  else for (const p of pieces) drawPiece(ctx, p.x, p.y, p.rot);

  drawBalls();
  drawWedge();

  // plet-effecten: ring + vonkjes
  for (const f of fx) {
    ctx.strokeStyle = `rgba(255,255,255,${1 - f.age / 0.35})`;
    ctx.lineWidth = Math.max(1, rb * 0.5);
    ctx.beginPath();
    ctx.arc(f.x, f.y, rb * (1 + (f.age / 0.35) * 5), 0, TAU);
    ctx.stroke();
  }
  for (const sp of sparks) {
    ctx.globalAlpha = Math.max(0, sp.life / 0.45);
    ctx.fillStyle = colorMode === "custom" ? customColor : `hsl(${Math.round(sp.h)},85%,70%)`;
    ctx.beginPath(); ctx.arc(sp.x, sp.y, Math.max(1, rb * 0.4), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // teller (geen limiet meer: gewoon het aantal ballen)
  ctx.textAlign = "center";
  ctx.fillStyle = "#8a8aa8";
  ctx.font = `${R * 0.05}px Arial, sans-serif`;
  ctx.fillText(`${balls.length} balls`, cx, cy + R + R * 0.1);
    // ====== verticale TikTok-opname ======
recordCtx.fillStyle = "#000000";
recordCtx.fillRect(0, 0, 1080, 1920);

// Selecteer alleen het gebied rond de arena
const cropW = R * 2.1;
const cropH = cropW * (1920 / 1080);

const cropX = (cx - cropW / 2) * dpr;
const cropY = (cy - cropH / 2) * dpr;

recordCtx.drawImage(
  canvas,
  cropX, cropY,
  cropW * dpr, cropH * dpr,
  0, 0,
  1080, 1920
);
  
}

// ====== OPTIES: kleur, snelheid, opname ======
const $ = id => document.getElementById(id);

$("gear").addEventListener("click", () => $("panel").classList.toggle("open"));

$("colorMode").addEventListener("change", e => {
  colorMode = e.target.value;
  $("colorRow").style.display = colorMode === "custom" ? "flex" : "none";
});
$("colorPick").addEventListener("input", e => {
  customColor = e.target.value;
  customHSL = hexToHsl(customColor);
  customSprite = null;
});

$("speed").addEventListener("input", e => {
  simSpeed = parseFloat(e.target.value);
  $("speedVal").textContent = simSpeed.toFixed(2).replace(/0$/, "") + "×";
});

$("restartBtn").addEventListener("click", () => reset());

// --- opnemen ---
let recorder = null, recChunks = [], recTimer = null, recStart = 0, recMime = "";

function pickMime() {
  const opts = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  return opts.find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}

 
async function startRecording() {
  if (!window.MediaRecorder || !canvas.captureStream) {
    alert("Your browser does not support animation recording.");
    return;
  }

  if ($("recRestart").checked) reset();
  recMime = pickMime();

  // Audio activeren
  initSound();

  if (soundContext && soundContext.state === "suspended") {
    await soundContext.resume();
  }

  // Resolutie instellen
  const target = parseInt($("recQuality").value, 10) || 0;

  if (target) {
    try {
      setRenderScale(target / Math.min(W, H));
    } catch (err) {
      setRenderScale(displayDpr);
      alert("This quality is too demanding. Choose a lower setting.");
      return;
    }
  }

  const pixels = recordCanvas.width * recordCanvas.height;

const bitrate = 6_000_000;

  let stream;

  try {
    const videoStream = recordCanvas.captureStream(30);
    const tracks = [...videoStream.getVideoTracks()];

    // Audiotrack toevoegen en controleren
if (soundContext && soundMaster) {
  if (!window.satisfyAudioDestination) {
    window.satisfyAudioDestination =
      soundContext.createMediaStreamDestination();

    soundMaster.connect(window.satisfyAudioDestination);
  }

  const audioTracks =
    window.satisfyAudioDestination.stream.getAudioTracks();

  for (const track of audioTracks) {
    track.enabled = true;

    if (track.readyState === "live") {
      tracks.push(track);
    }
  }
}

    stream = new MediaStream(tracks);

    recorder = new MediaRecorder(
      stream,
      recMime
        ? { mimeType: recMime, videoBitsPerSecond: bitrate }
        : { videoBitsPerSecond: bitrate }
    );

    recChunks = [];
  } catch (err) {
    restoreScale();
    alert("Recording could not start. Try a lower quality.");
    return;
  }

  recorder.ondataavailable = e => {
    if (e.data && e.data.size) recChunks.push(e.data);
  };

  recorder.onstop = () => {
    saveRecording();
    stream.getTracks().forEach(track => track.stop());
  };

  recorder.start(250);

console.log(
  "Recording audio tracks:",
  stream.getAudioTracks().length
);

  recStart = performance.now();
  $("recBtn").classList.add("on");
  updateRecLabel();
  recTimer = setInterval(updateRecLabel, 500);
}


function updateRecLabel() {
  const sec = Math.floor((performance.now() - recStart) / 1000);
  const m = Math.floor(sec / 60), r = String(sec % 60).padStart(2, "0");
  $("recBtn").textContent = `■ Stop opname (${m}:${r})`;
}

function stopRecording() {
  if (recorder && recorder.state !== "inactive") recorder.stop();
  clearInterval(recTimer);
  $("recBtn").classList.remove("on");
  $("recBtn").textContent = "● Start recording";
}

function restoreScale() {
  if (dpr !== displayDpr) setRenderScale(displayDpr);
}

function updateRecInfo() {
  const target = parseInt($("recQuality").value, 10) || 0;
  const sc = target ? target / Math.min(W, H) : displayDpr;
  $("recInfo").textContent = `Video resolution: ${Math.round(W * sc)} × ${Math.round(H * sc)} px` +
    (target >= 1440 ? " (may be demanding on your device)" : "");
}
$("recQuality").addEventListener("change", updateRecInfo);

function saveRecording() {
  const type = (recorder && recorder.mimeType) || recMime || "video/webm";
  const blob = new Blob(recChunks, { type });
  const ext = type.includes("mp4") ? "mp4" : "webm";
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `will-it-overflow.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  recorder = null;
  restoreScale();
}

function isRecording() { return recorder && recorder.state === "recording"; }

// wordt aangeroepen als de overflow-animatie klaar is
function finishRun() {
  if (isRecording() && $("recAuto").checked) stopRecording();
}

$("recBtn").addEventListener("click", () => (isRecording() ? stopRecording() : startRecording()));

// ====== geoptimaliseerde hoofdlus ======

let last = performance.now();
let acc = 0;

const DT = 1 / 60;
const MAX_STEPS = 5;

let animationFrame = null;
let isPageActive = !document.hidden;

function loop(now) {
  if (!isPageActive) return;

  const frameTime = Math.min(0.05, (now - last) / 1000);
  last = now;

  acc += frameTime * simSpeed;

  let steps = 0;

  while (acc >= DT && steps < MAX_STEPS) {
    step(DT);
    acc -= DT;
    steps++;
  }

  if (steps >= MAX_STEPS) {
    acc = 0;
  }

  draw();

  animationFrame = requestAnimationFrame(loop);
}

function handleVisibilityChange() {
  isPageActive = !document.hidden;

  if (isPageActive) {
    last = performance.now();
    acc = 0;

    if (animationFrame === null) {
      animationFrame = requestAnimationFrame(loop);
    }
  } else {
    if (animationFrame !== null) {
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }
  }
}

document.addEventListener("visibilitychange", handleVisibilityChange);

if (isPageActive) {
  animationFrame = requestAnimationFrame(loop);

}

window.addEventListener("resize", () => { if (!isRecording()) { resize(); updateRecInfo(); } });
resize();
updateRecInfo();
requestAnimationFrame(loop);
</script>
